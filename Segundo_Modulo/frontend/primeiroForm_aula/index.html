<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Escola - Área do Aluno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <!-- Cabeçalho -->
<header class="header">
<h1>Meta Escola</h1>
<p>Área do Aluno</p>
</header>
 <!-- Conteúdo Principal / Caixa de Login -->
<main class="main-container">
<div class="login-card">
<h2>Entrar</h2>
<p class="subtitle">Digite seus dados para acessar a conta</p>
 <form>
<div class="input-group">
<label for="email">Digite seu E-mail</label>
<input type="email" id="email" placeholder="Digite seu email">
</div>
<div class="input-group">
<label for="senha">Senha</label>
<input type="password" id="senha" placeholder="Digite sua senha">
</div>
<button type="submit" class="btn-entrar">Entrar</button>
</form>
<p class="signup-text">Ainda não possui uma conta? <a href="#">Cadastre-se</a></p>
 </div>
</main>
<!-- Rodapé -->
<footer class="footer">
 <p>&copy;2026 Lucimar Santos | Todos os Direitos Reservados</p>
</footer>
</body>
</html>
